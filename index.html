<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="x5-page-mode" content="app" />
<title>ABC 英语小游戏</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:linear-gradient(#fff3e0,#ffe0b2); color:#4e342e; text-align:center;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  #app{max-width:480px; margin:0 auto; padding:14px 14px 30px; min-height:100%}
  h1{font-size:26px; color:#e65100; margin:10px 0 2px}
  h2{font-size:22px; color:#e65100; margin:6px 0}
  .sub{color:#8d6e63; font-size:14px; margin-bottom:16px}
  .top{display:flex; align-items:center; justify-content:space-between; min-height:44px}
  .back{background:#fff; color:#e65100; box-shadow:0 3px 0 #ffcc80; font-size:16px; padding:8px 14px; margin:0}
  button{
    font-family:inherit; font-size:20px; padding:14px 22px; border:none; border-radius:18px;
    background:#ff7043; color:#fff; box-shadow:0 5px 0 #d84315; cursor:pointer;
  }
  button:active{transform:translateY(3px); box-shadow:0 2px 0 #d84315}
  .big{display:block; width:100%; margin:18px 0; padding:22px 10px; font-size:24px}
  .big small{display:block; font-size:14px; opacity:.9; margin-top:4px}
  .big.green{background:#43a047; box-shadow:0 5px 0 #2e7d32}
  .big.blue{background:#1e88e5; box-shadow:0 5px 0 #1565c0}
  .big.green:active,.big.blue:active{box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px}
  .card{
    background:#fff; border-radius:22px; padding:14px 8px;
    box-shadow:0 5px 0 #ffcc80; min-height:130px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .card:active{transform:translateY(3px); box-shadow:0 2px 0 #ffcc80}
  .emoji{font-size:54px; line-height:1.15}
  .emoji svg{width:1em; height:1em; display:inline-block; vertical-align:middle}
  .en{font-size:19px; font-weight:700; margin-top:6px}
  .zh{font-size:15px; color:#8d6e63; margin-top:2px}
  .card.sentence{grid-column:1 / 3; flex-direction:row; gap:12px; min-height:90px}
  .card.sentence .txt{text-align:left}
  .card.sentence .emoji{font-size:44px}
  /* 游戏 */
  .dots{font-size:18px; letter-spacing:3px; min-height:26px; margin:6px 0}
  .speaker{width:110px; height:110px; border-radius:55px; font-size:50px; padding:0; margin:14px auto; display:block}
  .choices{display:grid; grid-template-columns:1fr; gap:14px; margin-top:10px}
  .choices.w{grid-template-columns:1fr 1fr 1fr}
  .choices.w .card{min-height:130px}
  .choices.w4{grid-template-columns:1fr 1fr}
  .choices.story .card{min-height:120px}
  .choices.story .emoji{font-size:38px}
  .card{position:relative}
  .badge{position:absolute; top:6px; left:10px; font-size:24px; color:#2e7d32; font-weight:700}
  .big.locked{background:#e0e0e0; color:#757575; box-shadow:0 5px 0 #bdbdbd; border-radius:18px; font-size:20px}
  .row .ok{background:#43a047; box-shadow:0 4px 0 #2e7d32}
  .card.hint{background:#fffde7; box-shadow:0 0 0 5px #ffd54f, 0 5px 0 #ffb300; animation:glow .8s infinite}
  @keyframes glow{50%{transform:scale(1.07)}}
  .card.correct{background:#c8f7c5; box-shadow:0 5px 0 #85c98a; animation:pop .5s}
  .card.wrong{background:#ffd6d6; box-shadow:0 5px 0 #e29a9a; animation:shake .4s}
  @keyframes pop{50%{transform:scale(1.12)}}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .stars{font-size:40px; margin:10px 0}
  /* 详情浮层 */
  #detail{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; padding:18px; z-index:10;
  }
  #detail.show{display:flex}
  .panel{background:#fff; border-radius:28px; padding:22px 16px; width:100%; max-width:420px; max-height:94vh; overflow-y:auto}
  /* 音标 + 跟读 */
  .ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS","Noto Sans","Segoe UI",system-ui,sans-serif; color:#5c6bc0; font-size:15px; margin-top:2px; letter-spacing:.3px}
  .panel .ipa,.card.teach .ipa{font-size:20px; margin-top:4px}
  button.rec{background:#e53935; box-shadow:0 4px 0 #b71c1c; font-size:18px; padding:10px 20px; margin-top:14px}
  button.rec.rec-on{animation:pulse .8s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .recres{min-height:20px; margin-top:10px; font-size:18px; color:#4e342e}
  .recres .stars2{font-size:34px}
  .recres .small{font-size:12px; color:#8d6e63; margin-top:4px; line-height:1.5}
  .panel .emoji{font-size:96px}
  .panel .en{font-size:30px; margin-top:8px}
  .panel .zh{font-size:22px}
  .panel .sen{font-size:20px; color:#e65100; margin-top:12px; font-weight:600}
  .panel .senzh{font-size:15px; color:#8d6e63}
  .row{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap}
  .row button{font-size:18px; padding:12px 16px}
  .row .ghost{background:#eee; color:#555; box-shadow:0 4px 0 #ccc}
  .footer{margin-top:24px; font-size:12px; color:#a1887f; line-height:1.7}
  .footer span{padding:8px 12px; display:inline-block}
  /* 魔法任务 / 小花园 / 家长页 */
  .big.quest{background:linear-gradient(#ab47bc,#8e24aa); box-shadow:0 5px 0 #6a1b9a}
  .chips{margin:4px 0 2px}
  .chip{display:inline-block; background:#fff; border-radius:20px; padding:6px 14px; font-size:15px; color:#e65100; box-shadow:0 2px 0 #ffcc80}
  .sec-title{margin:18px 0 0; font-size:15px; color:#8d6e63}
  .fb{min-height:30px; font-size:20px; color:#2e7d32; font-weight:700; margin:2px 0 8px}
  .card.teach{padding:24px 12px; min-height:260px; margin-top:10px}
  .card.teach .emoji{font-size:110px}
  .card.teach .emoji svg{margin:-4px 0}
  .card.teach .en{font-size:32px}
  .card.teach .zh{font-size:22px}
  .card.teach .sen{font-size:18px; color:#e65100; margin-top:10px; font-weight:600}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px}
  .card.mini{min-height:120px; padding:8px 2px}
  .card.mini .emoji{font-size:38px}
  .card.mini .en{font-size:14px; margin-top:2px}
  .stage{font-size:26px; position:relative; line-height:1.2}
  .drop{position:absolute; right:-20px; top:-4px; font-size:16px}
  .card.locked{opacity:.45; filter:grayscale(1)}
  .sec{background:#fff; border-radius:18px; padding:12px 14px; margin:12px 0; text-align:left; box-shadow:0 3px 0 #ffcc80}
  .sec h3{margin:0 0 8px; font-size:16px; color:#e65100}
  .sec .line{font-size:14px; padding:5px 0; display:flex; justify-content:space-between; border-bottom:1px dashed #eee}
  .sec .note{font-size:13px; color:#795548; line-height:1.6}
  .hist{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .hw{text-align:center; font-size:12px; color:#8d6e63}
  .hd{display:flex; flex-direction:column; align-items:center; font-size:16px}
  .hd i{font-size:9px; color:#999; font-style:normal}
  .hd.today{background:#fff3e0; border-radius:8px}
  .tip{padding:7px 0; border-bottom:1px dashed #eee; font-size:15px}
  .tip:last-child{border-bottom:0}
  .temo svg{width:22px; height:22px; vertical-align:middle}
  .tag{font-size:11px; color:#fff; background:#ffa726; border-radius:8px; padding:1px 6px; vertical-align:middle}
  textarea{width:100%; height:90px; font-size:12px; border-radius:10px; border:1px solid #ddd; padding:6px; margin-top:8px; -webkit-user-select:text; user-select:text}
  .small-btn{font-size:14px; padding:8px 14px; margin:8px 6px 0 0; border-radius:12px; box-shadow:0 3px 0 #d84315}
  .small-btn.ghost{background:#eee; color:#555; box-shadow:0 3px 0 #ccc}
  .small-btn.on{background:#43a047; box-shadow:0 3px 0 #2e7d32}
  .dots.tiny{font-size:13px; letter-spacing:1px}
  .rng{width:100%; margin:8px 0 0; accent-color:#ff7043}
  .rngrow{display:flex; justify-content:space-between; font-size:12px; color:#999}
  input.nm{width:100%; font-size:22px; padding:12px; text-align:center; border:2px solid #ffcc80; border-radius:14px; font-family:inherit; color:#4e342e; -webkit-user-select:text; user-select:text; outline:none}
  input.nm:focus{border-color:#ff7043}
  .fb.err{color:#d84315; font-size:15px; min-height:22px; margin:6px 0 0}
  .note-c{font-size:13px; color:#8d6e63; line-height:1.7; margin:8px 4px}
  .prof{padding:8px 0; border-bottom:1px dashed #eee}
  .sec .note.warn{color:#d84315; background:#fff3e0; border-radius:8px; padding:6px 8px; margin:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="detail"><div class="panel" id="panel"></div></div>

<script src="data.js?v=15"></script>
<script src="art.js?v=15"></script>
<script src="play.js?v=15"></script>
<script src="speak.js?v=15"></script>
<script src="profile.js?v=15"></script>
<script src="srs.js?v=15"></script>
<script src="account.js?v=15"></script>
<script>
/* 语音播放（player / playSeq / 预加载）在 play.js 里。这里只放“怎么拼出一段语音”。 */
const clip = (kind, id, text, lang) => ({url:`audio/${kind}/${id}.mp3`, text, lang});
// 一个词/句子可能用到的全部语音地址（用来在后台预加载）
const clipUrls = it => {
  const u = [enClip(it).url, zhClip(it).url];
  if(!it.sentence && it.game !== false) u.push(enClip(it, 2).url);
  if(it.sen) u.push(senClip(it).url, senClip(it, 2).url, senZhClip(it).url);
  return u;
};

// v === 2 用第二个英文声音（en2 / sen2），其余用默认声音
const enClip  = (it, v) => clip(v === 2 ? "en2" : "en", it.id, it.en, "en");
const zhClip  = it => clip("zh", it.id, it.zh, "zh");
const senClip = (it, v) => clip(v === 2 ? "sen2" : "sen", it.id, it.sen, "en");
const senZhClip = it => clip("senzh", it.id, it.senZh, "zh");
// “动一动”的英语指令（data.js 的 ACTS）
const actClip = it => { const a = (typeof ACTS !== "undefined") && ACTS[it.id]; return clip("act", it.id, a ? a.en : it.en, "en"); };
// 家长页里的“中文翻译”设置（srs.js 的 zhAll）；读不到设置时保持原来的每题都播中文
const showZh = () => { try{ return zhAll(); }catch(e){ return true; } };
const fx = id => { const f = FX.find(x=>x.id===id); return f ? clip("fx", id, f.text, f.lang) : null; };  // 找不到（比如缓存了旧 data.js）就跳过，不影响游戏

/* ============ 基础 ============ */
const app = document.getElementById("app");
const detail = document.getElementById("detail");
const panel = document.getElementById("panel");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let lesson = null;

const itemCard = (it, idx) => `
  <div class="card ${it.sentence?"sentence":""}" data-act="pick" data-i="${idx}">
    <div class="emoji">${it.emoji}</div>
    <div class="txt"><div class="en">${it.en}</div>${ipaHtml(it)}<div class="zh">${it.zh}</div></div>
  </div>`;

/* ============ 页面 ============ */
function home(){
  session++; token++; player.pause();
  app.innerHTML = `
    <h1>🔤 ABC 英语小游戏</h1>
    <div class="sub">点一点，听一听，学英语</div>
    ${homeQuestHtml()}
    ${LESSONS.map((l,i)=>`
      <button class="big" data-act="lesson" data-i="${i}">
        ${l.icon} ${l.title}<small>${l.zh}</small>
      </button>`).join("")}
    <div class="footer">建议打开手机声音 🔊<br><span data-act="parent">👨‍👩‍👧 家长页</span></div>`;
}

function lessonMenu(i){
  session++;
  lesson = LESSONS[i];
  app.innerHTML = `
    <div class="top"><button class="back" data-act="home">← 返回</button><span></span></div>
    <h1>${lesson.icon} ${lesson.title}</h1>
    <div class="sub">${lesson.zh}</div>
    <button class="big green" data-act="learn">📖 学一学<small>点图片，听英文和中文</small></button>
    <button class="big blue" data-act="game">🎮 玩一玩<small>听声音，找图片</small></button>`;
  playSeq([fx("fx_welcome_zh")]);
}

/* ---- 学一学 ---- */
function learn(){
  session++;
  app.innerHTML = `
    <div class="top"><button class="back" data-act="menu">← 返回</button><span></span></div>
    <h2>📖 学一学</h2>
    <div class="grid">${lesson.items.map((it,i)=>itemCard(it,i)).join("")}</div>`;
  playSeq([fx("fx_welcome_zh")]);
}
let cur = 0;
function showDetail(i){
  cur = i;
  const it = lesson.items[i];
  panel.innerHTML = `
    <div class="emoji">${it.emoji}</div>
    <div class="en">${it.en}</div>
    ${ipaHtml(it)}
    <div class="zh">${it.zh}</div>
    ${it.sen ? `<div class="sen">${it.sen}</div><div class="senzh">${it.senZh}</div>` : ""}
    ${recHtml(it)}
    <div class="row">
      <button class="ghost" data-act="prev">◀</button>
      <button data-act="say">🔊 听</button>
      <button class="ghost" data-act="next">▶</button>
    </div>
    <div class="row"><button class="ghost" data-act="close">关闭</button></div>`;
  detail.classList.add("show");
  say();
}
function say(){
  const it = lesson.items[cur];
  const list = [enClip(it), zhClip(it)];
  if(it.sen) list.push(senClip(it), senZhClip(it));
  playSeq(list);
}

/* ---- 玩一玩 ---- */
let rounds = [], ri = 0, stars = 0, missed = false, locked = false, choices = [], session = 0;
function game(){
  session++;
  const pool = lesson.items.filter(i=>i.game !== false);
  rounds = shuffle(pool).slice(0, 8);
  ri = 0; stars = 0;
  warmFor(rounds);
  round();
}
// 有句子的（如 I can be a teacher.）读句子，否则读单词
const promptClips = it => [it.sen ? senClip(it) : enClip(it)];
function round(){
  const pool = lesson.items.filter(i=>i.game !== false);
  const it = rounds[ri];
  const same = pool.filter(p => !!p.sentence === !!it.sentence && p.id !== it.id);
  choices = shuffle([it, ...shuffle(same).slice(0, 2)]);
  missed = false; locked = false;
  const dots = rounds.map((_,i)=> i<ri ? "⭐" : (i===ri ? "🔹" : "⚪")).join("");
  app.innerHTML = `
    <div class="top"><button class="back" data-act="menu">← 返回</button><span></span></div>
    <div class="dots">${dots}</div>
    <h2>🎧 听一听，找一找</h2>
    <button class="speaker" data-act="repeat">🔊</button>
    <div class="choices ${it.sentence?"":"w"}">
      ${choices.map((c,i)=>`
        <div class="card ${c.sentence?"sentence":""}" data-act="choose" data-i="${i}">
          <div class="emoji">${c.emoji}</div>
        </div>`).join("")}
    </div>`;
  playSeq([...(ri < 2 || showZh() ? [fx("fx_find_zh")] : []), ...promptClips(it)]);     // 中文提示只在前 2 题播
}
async function choose(i, el){
  if(locked) return;
  const it = rounds[ri], c = choices[i];
  if(c.id === it.id){
    locked = true;
    el.classList.add("correct");
    if(!missed) stars++;
    const s = session;
    await playSeqCapped(showZh() ? [fx("fx_good_en"), fx("fx_good_zh"), enClip(it), zhClip(it)] : [fx("fx_good_en"), enClip(it)]);
    if(s !== session) return;   // 中途已退出本局
    ri++;
    ri < rounds.length ? round() : finish();
  }else{
    missed = true;
    el.classList.add("wrong");
    setTimeout(()=>el.classList.remove("wrong"), 500);
    playSeq([fx("fx_try_en"), ...promptClips(it)]);
  }
}
function finish(){
  app.innerHTML = `
    <div class="top"><span></span><span></span></div>
    <h1>🎉 太棒了！</h1>
    <div class="stars">${"⭐".repeat(stars) || "🌟"}</div>
    <div class="sub">一次就答对 ${stars} / ${rounds.length} 个</div>
    <button class="big blue" data-act="game">🔁 再玩一次</button>
    <button class="big green" data-act="learn">📖 去学一学</button>
    <button class="big" data-act="home">🏠 回到首页</button>`;
  playSeq([fx("fx_done_zh")]);
}

/* ============ 事件 ============ */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const i = +t.dataset.i;
  switch(t.dataset.act){
    case "home":   home(); break;
    case "lesson": lessonMenu(i); break;
    case "menu":   lessonMenu(LESSONS.indexOf(lesson)); break;
    case "learn":  learn(); break;
    case "game":   game(); break;
    case "pick":   showDetail(i); break;
    case "say":    say(); break;
    case "prev":   showDetail((cur-1+lesson.items.length)%lesson.items.length); break;
    case "next":   showDetail((cur+1)%lesson.items.length); break;
    case "close":  detail.classList.remove("show"); token++; player.pause(); break;
    case "repeat": if(!locked) playSeq(promptClips(rounds[ri])); break;
    case "choose": choose(i, t); break;
  }
});

boot();
</script>
</body>
</html>
