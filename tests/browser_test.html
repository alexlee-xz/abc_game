<!DOCTYPE html>
<meta charset="utf-8">
<title>browser test</title>
<pre id="out">running...</pre>
<iframe id="f" src="../index.html" style="width:400px;height:700px"></iframe>
<script>
// Loads the real index.html in an iframe, clicks "quest", and reports JS errors + resulting screen.
const out = document.getElementById("out"), f = document.getElementById("f");
const log = [];
// an exception inside the test itself would otherwise leave "running..." on the page forever
window.addEventListener("unhandledrejection", e => { out.textContent = "TEST ERROR: " + (e.reason && e.reason.stack || e.reason) + "\n" + log.join("\n"); document.title = "DONE"; });
f.addEventListener("load", async () => {
  const w = f.contentWindow, d = f.contentDocument;
  w.addEventListener("error", e => log.push("ERROR: " + e.message + " @" + (e.filename||"").split("/").pop() + ":" + e.lineno));
  w.addEventListener("unhandledrejection", e => log.push("REJECT: " + (e.reason && e.reason.stack || e.reason)));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const click = sel => { const el = d.querySelector(sel); if(!el) { log.push("NOT FOUND " + sel); return false; } el.click(); return true; };
  // ?stale=1 simulates a phone that cached the OLD data.js (without the 4 newest FX entries)
  if(location.search.includes("stale=1")){ w.eval("FX.splice(7)"); log.push("simulated stale data.js, FX length=" + w.eval("FX.length")); }
  w.alert = m => log.push("ALERT: " + String(m).slice(0, 40)); w.confirm = () => true; w.prompt = () => "Lilian";
  // first run: no child yet -> welcome page asks for a name; nothing is saved until a name is given
  log.push("first run: welcome=" + !!d.getElementById("nm") + " saved keys=" + w.eval("Object.keys(localStorage).join()") + "|");
  d.getElementById("nm").value = "  "; click('[data-act="prof-create"]');
  log.push("blank name error: " + d.getElementById("nmerr").textContent);
  const nmEl = d.getElementById("nm"); nmEl.value = "Lily";
  nmEl.dispatchEvent(new w.KeyboardEvent("keydown", {key: "Enter", bubbles: true})); await sleep(150);
  log.push("after Enter: chip='" + (d.querySelector(".chip[data-act='prof-chooser']") || {textContent: "-"}).textContent.trim() + "' profiles=" + w.eval("PROFS.list.length"));
  log.push("home has quest button: " + !!d.querySelector('[data-act="quest"]'));
  click('[data-act="quest"]');
  await sleep(500);
  log.push("quest teach page: ipa=" + !!d.querySelector(".card.teach .ipa") + " recBtn=" + !!d.querySelector("button.rec"));
  // first quiz after the new-word page: tap the right card, expect the "again later" feedback for a new word
  if(click('[data-act="q-next"]')){
    await sleep(300);
    log.push("quiz page: dots=" + !!d.querySelector(".dots") + " speaker=" + !!d.querySelector(".speaker") + " cards=" + d.querySelectorAll('[data-act="q-choose"]').length);
    const right = w.eval("Q.choices.findIndex(c => c.en.toLowerCase() === Q.cur.en.toLowerCase())");
    d.querySelectorAll('[data-act="q-choose"]')[right].click(); await sleep(300);
    log.push("feedback: " + d.getElementById("fb").textContent + " | log entries: " + w.eval("SRS.log.length"));
  }
  // parent page: new sections + level buttons
  click('[data-act="home"]'); await sleep(100);
  // letters: home entry -> grid -> detail (star) -> game round
  click('[data-act="alpha"]'); await sleep(100);
  log.push("alphabet page: tiles=" + d.querySelectorAll('[data-act="al-open"]').length + " (expect 26) game button=" + !!d.querySelector('[data-act="al-game"]'));
  click('[data-act="al-open"][data-i="0"]'); await sleep(150);
  log.push("letter detail: word=" + d.querySelector("#panel .en").textContent + " letter=" + d.querySelector("#panel .alp").textContent.replace(/\s/g, "") + " stars=" + w.eval("alphaTotals().stars") + " (expect 1)");
  click('[data-act="al-close"]'); await sleep(50);
  click('[data-act="al-game"]'); await sleep(150);
  log.push("letters game: choices=" + d.querySelectorAll('[data-act="al-choose"]').length + " (expect 3) letter size=" + Math.round(d.querySelector(".card.letter").getBoundingClientRect().height) + "px");
  w.eval("home()"); await sleep(100);
  click('[data-act="parent"]'); await sleep(200);
  log.push("gate: shown=" + !!d.getElementById("gate") + " parentPageHidden=" + !d.querySelector(".ptabs") + " question=" + d.querySelector(".gate-q").textContent);
  d.getElementById("gate").value = String(w.eval("parentGateQ.a + parentGateQ.b + 1")); click('[data-act="p-gate"]'); await sleep(100);
  log.push("gate wrong answer: still locked=" + (!!d.getElementById("gate") && !d.querySelector(".ptabs")) + " msg='" + d.getElementById("gate-err").textContent + "'");
  d.getElementById("gate").value = String(w.eval("parentGateQ.a + parentGateQ.b"));
  d.getElementById("gate").dispatchEvent(new w.KeyboardEvent("keydown", {key: "Enter", bubbles: true})); await sleep(200);
  const ph = d.getElementById("app").textContent;
  log.push("parent page: tabs=" + d.querySelectorAll(".ptabs button").length + " todo=" + ph.includes("需要你做的事") + " forgetting=" + ph.includes("遗忘情况") + " learning=" + ph.includes("还没学会的词") + " sliders on overview=" + d.querySelectorAll("input.rng").length + " (expect 0)");
  const det = d.querySelector('details[data-keep="deep"]');
  log.push("analysis folded: " + (det && !det.open) + " | curve hidden while folded: " + (d.querySelector('svg[aria-label="遗忘曲线"]') === null || d.querySelector('svg[aria-label="遗忘曲线"]').getBoundingClientRect().width === 0));
  click('[data-act="p-tab"][data-t="set"]'); await sleep(100);
  log.push("settings tab: presets=" + d.querySelectorAll('[data-act="p-preset"]').length + " sliders=" + d.querySelectorAll("input.rng").length + " (expect 7) advancedFolded=" + !d.querySelector('details[data-keep="adv"]').open);
  click('[data-act="p-preset"][data-v="easy"]'); await sleep(100);
  log.push("preset easy: newPerDay=" + w.eval("SRS.cfg.newPerDay") + " zh=" + w.eval("SRS.cfg.zh") + " say=" + w.eval("SRS.cfg.say") + " label=" + d.getElementById("presets").innerText.slice(0, 8).replace(/\n/g, " "));
  click('[data-act="p-preset"][data-v="std"]'); await sleep(100);
  const advEl = d.querySelector('details[data-keep="adv"]'); advEl.open = true; await sleep(100);       // the 'toggle' event remembers it
  click('[data-act="p-set"][data-k="act"][data-v="0"]'); await sleep(100);
  log.push("advanced stays open after a re-render: " + d.querySelector('details[data-keep="adv"]').open + " | custom label: " + d.getElementById("presets").innerText.includes("自定义"));
  click('[data-act="p-set"][data-k="act"][data-v="1"]'); await sleep(100);
  click('[data-act="p-tab"][data-t="view"]'); await sleep(100);
  // forgetting curve: seed some data, re-open the parent page and check the SVG is well-formed XML with the expected marks
  w.eval("SRS.curve = [[6,6],[5,4],[4,3],[3,2],[2,1],[1,0],[0,0]]; saveSRS(); parentPage('view');"); await sleep(100);
  d.querySelector('details[data-keep="deep"]').open = true; await sleep(100);
  const svgEl = d.querySelector('svg[aria-label="遗忘曲线"]');
  const parsed = svgEl ? new DOMParser().parseFromString(new XMLSerializer().serializeToString(svgEl), "image/svg+xml") : null;
  log.push("curve svg: found=" + !!svgEl + " wellFormed=" + (parsed && !parsed.querySelector("parsererror")) + " circles=" + (svgEl ? svgEl.querySelectorAll("circle").length : 0)
    + " size=" + (svgEl ? Math.round(svgEl.getBoundingClientRect().width) + "x" + Math.round(svgEl.getBoundingClientRect().height) : "-"));
  w.eval("SRS.curve = freshCurve(); saveSRS(); parentPage('set');"); await sleep(100);
  d.querySelector('details[data-keep="adv"]').open = true; await sleep(100);
  // drag the three sliders with real input events
  const setRange = (key, v) => { const el = d.querySelector('input[data-set="' + key + '"]'); el.value = v; el.dispatchEvent(new w.Event("input", {bubbles: true})); return el; };
  setRange("newPerDay", 4); setRange("promptRate", 7);
  const enEl = setRange("enRate", 20); enEl.dispatchEvent(new w.Event("change", {bubbles: true})); await sleep(300);
  log.push("speed slider range: " + enEl.min + "-" + enEl.max);
  log.push("settings now: newPerDay=" + w.eval("newPerDay()") + " prompt=" + w.eval("SRS.cfg.promptRate") + " en=" + w.eval("SRS.cfg.enRate")
    + " | labels: " + d.getElementById("v-new").textContent + " " + d.getElementById("v-promptRate").textContent + " " + d.getElementById("v-enRate").textContent);
  log.push("player rate after English preview: " + w.eval("player.playbackRate"));
  click('[data-act="p-try-prompt"]'); await sleep(200);
  log.push("player rate after prompt preview: " + w.eval("player.playbackRate"));
  setRange("newPerDay", 3); setRange("promptRate", 10); setRange("enRate", 10);
  log.push("restored: " + w.eval("newPerDay()"));
  // learn mode -> detail panel for "teacher": IPA shown, read-aloud scored with a mocked recogniser
  click('[data-act="p-back"]'); await sleep(100);
  log.push("back button locks the parent page: " + (w.eval("parentUntil") === 0));
  click('[data-act="lesson"][data-i="1"]'); await sleep(100);
  click('[data-act="learn"]'); await sleep(100);
  log.push("learn grid ipa count: " + d.querySelectorAll(".card .ipa").length);
  click('[data-act="pick"][data-i="2"]'); await sleep(200);
  const ipa = d.querySelector("#panel .ipa");
  log.push("detail ipa ok: " + (ipa && ipa.textContent === "/ˈtiːtʃər/"));
  const MockRecog = class{
    start(){ setTimeout(() => { this.onresult({results: [[{transcript: "teacher"}]]}); this.onend(); }, 50); }
    stop(){}
  };
  w.SpeechRecognition = w.webkitSpeechRecognition = MockRecog;   // newer Chromium has a native unprefixed one
  click('#panel button.rec'); await sleep(600);
  const res = d.getElementById("recres").textContent;
  log.push("rec stars: " + (res.match(/⭐/g) || []).length + " / 3, text length " + res.length);
  // 4-choice layout, hint after two wrong taps, retry queued, finish-page tips, SVG pictures in the garden
  w.eval("home()"); await sleep(100);
  w.eval(`SRS = freshSRS(); ["teacher","vet","doctor","nurse","hose"].forEach(k => SRS.words[k] = Object.assign(newWord(todayNum()), {box: 3, due: todayNum(), lastGood: todayNum() - 2, last: todayNum() - 2}));
          SRS.daily = {day: todayNum(), newCount: 99, done: false, news: []}; saveSRS(); home();`);
  click('[data-act="quest"]'); await sleep(300);
  const cards = d.querySelectorAll('[data-act="q-choose"]');
  log.push("level-3 quiz: cards=" + cards.length + " grid=" + w.getComputedStyle(d.querySelector(".choices")).gridTemplateColumns + " sentencePrompt=" + w.eval("Q.sent"));
  const ri = w.eval("Q.choices.findIndex(c => c.en === Q.cur.en)"), wi = ri === 0 ? 1 : 0;
  cards[wi].click(); await sleep(100); cards[wi].click(); await sleep(100);
  log.push("hint on the right card after 2 wrong taps: " + cards[ri].classList.contains("hint"));
  cards[ri].click(); await sleep(300);
  log.push("retry queued: " + w.eval("Q.steps.filter(s => s.retry).length") + " (expect 1)");
  // session++ cancels the pending "next question" continuation of the last tap
  w.eval("session++; questFinish()"); await sleep(100);
  log.push("finish page tips: " + d.querySelectorAll(".tip").length + " | has section: " + d.getElementById("app").innerText.includes("家长小任务"));
  w.eval("garden()"); await sleep(100);
  const svgs = d.querySelectorAll(".card.mini .emoji svg");
  const gw = svgs[0] ? Math.round(svgs[0].getBoundingClientRect().width) : 0, gh = svgs[0] ? Math.round(svgs[0].getBoundingClientRect().height) : 0;
  log.push("garden svg pictures: " + svgs.length + " of " + d.querySelectorAll(".card.mini").length + " cards (expect all), size " + gw + "x" + gh + " (expect 38x38), emoji left: "
    + [...d.querySelectorAll(".card.mini .emoji")].filter(e => !e.querySelector("svg")).length);
  // story: locked at first, then unlocked, cards in the real layout, numbered badges, finish page
  w.eval(`SRS = freshSRS(); saveSRS(); home();`); await sleep(100);
  log.push("story locked on a fresh save: " + !!d.querySelector(".big.locked") + " | no story button: " + !d.querySelector('[data-act="story"]'));
  w.eval(`["fire station","alarm bell","firefighter","hose","save","cheer","pole"].forEach(k => SRS.words[k] = Object.assign(newWord(todayNum()), {box: 1, due: todayNum() + 1, lastGood: todayNum()})); saveSRS(); home();`); await sleep(100);
  log.push("story button after learning the unit: " + !!d.querySelector('[data-act="story"]'));
  click('[data-act="story"]'); await sleep(300);
  const stc = [...d.querySelectorAll('[data-act="st-pick"]')];
  log.push("story cards: " + stc.length + " grid=" + w.getComputedStyle(d.querySelector(".choices")).gridTemplateColumns + " badgePos=" + w.getComputedStyle(d.querySelector(".badge")).position);
  for(const k of [0, 1]){ d.querySelector('[data-act="st-pick"][data-i="' + k + '"]').click(); await sleep(150); }
  log.push("badges after 2 right taps: " + [...d.querySelectorAll(".badge")].map(b => b.textContent).filter(Boolean).join(""));
  d.querySelector('[data-act="st-pick"][data-i="2"]').click(); await sleep(900);
  log.push("story finished: " + d.getElementById("app").innerText.includes("故事讲完啦") + " | count=" + w.eval("SRS.story.fire"));
  // say screen and action screen in the real DOM
  w.eval(`SRS = freshSRS(); ["teacher","vet"].forEach(k => SRS.words[k] = Object.assign(newWord(todayNum()), {box: 4, due: todayNum(), lastGood: todayNum() - 3, last: todayNum() - 3}));
          SRS.daily = {day: todayNum(), newCount: 99, done: false, news: []}; saveSRS(); SAY_CHANCE = 1; home();`);
  click('[data-act="quest"]'); await sleep(300);
  w.eval("session++; Q.i = Q.steps.findIndex(s => s.type === 'say'); questStep()"); await sleep(200);
  const sayEn = d.getElementById("say-en");
  log.push("say screen: buttons=" + (!!d.querySelector('[data-act="s-ok"]') && !!d.querySelector('[data-act="s-no"]')) + " answerHidden=" + (w.getComputedStyle(sayEn).visibility === "hidden") + " choices=" + d.querySelectorAll('[data-act="q-choose"]').length);
  d.querySelector('[data-act="s-ok"]').click(); await sleep(200);
  log.push("say answered: answerVisible=" + (w.getComputedStyle(sayEn).visibility === "visible") + " feedback='" + d.getElementById("fb").textContent + "' box=" + w.eval("SRS.words.teacher.box + ',' + SRS.words.vet.box"));
  w.eval("session++; Q.i = Q.steps.findIndex(s => s.type === 'act'); questStep()"); await sleep(200);
  log.push("act screen: " + d.querySelector(".card.teach .en").textContent + " | hint: " + d.querySelector(".card.teach .zh").textContent + " | buttons=" + d.querySelectorAll('[data-act="a-done"],[data-act="a-skip"],[data-act="a-say"]').length);
  d.querySelector('[data-act="a-done"]').click(); await sleep(400);
  log.push("after act: " + (d.querySelector(".card.teach .en") ? d.querySelector(".card.teach .en").textContent : d.getElementById("app").innerText.slice(0, 20).replace(/\n/g, " ")));
  w.eval("SAY_CHANCE = 0");
  // parent page toggles: click and keep scroll position
  w.eval("parentPage('set')"); await sleep(100);
  d.querySelector('[data-act="p-set"][data-k="zh"][data-v="all"]').click(); await sleep(100);
  log.push("zh toggle: cfg=" + w.eval("SRS.cfg.zh") + " | on button: " + d.querySelector('[data-act="p-set"][data-k="zh"].on').dataset.v);
  w.eval("SRS = freshSRS(); saveSRS();");
  // pictures at their real sizes: learn grid (54px), detail panel (96px), new-word page (110px)
  const sz = sel => { const e = d.querySelector(sel); if(!e) return "missing"; const r = e.getBoundingClientRect(); return Math.round(r.width) + "x" + Math.round(r.height); };
  w.eval("home()"); await sleep(50);
  click('[data-act="lesson"][data-i="1"]'); await sleep(100); click('[data-act="learn"]'); await sleep(100);
  log.push("learn grid svg: " + d.querySelectorAll(".card .emoji svg").length + " of " + d.querySelectorAll(".card .emoji").length + " size " + sz(".card .emoji svg") + " (expect 54x54)");
  click('[data-act="pick"][data-i="2"]'); await sleep(150);
  log.push("detail panel svg: " + sz("#panel .emoji svg") + " (expect 96x96)"); click('[data-act="close"]');
  w.eval("home()"); await sleep(50); click('[data-act="quest"]'); await sleep(300);
  log.push("new-word page svg: " + sz(".card.teach .emoji svg") + " (expect 110x110)");
  // a picture really paints something: draw the <svg> of every picture on a canvas and count non-transparent pixels
  const paint = async svgText => { const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText); await img.decode(); const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"); x.drawImage(img, 0, 0, 64, 64); const a = x.getImageData(0, 0, 64, 64).data; let n = 0; for(let i = 3; i < a.length; i += 4) if(a[i] > 40) n++; return n; };
  const ART = w.eval("ART");
  const empties = []; for(const k of Object.keys(ART)){ if(await paint(ART[k]) < 400) empties.push(k); }
  log.push("pictures that render (>=10% painted): " + (Object.keys(ART).length - empties.length) + "/" + Object.keys(ART).length + (empties.length ? " EMPTY: " + empties.join() : ""));

  // ----- accounts in the real DOM -----
  w.eval(`SRS = freshSRS(); SRS.cfg.newPerDay = 5; saveSRS(); home();`); await sleep(50);
  click('.chip[data-act="prof-chooser"]'); await sleep(50);
  log.push("chooser: buttons=" + d.querySelectorAll('[data-act="prof-pick"]').length + " add=" + !!d.querySelector('[data-act="prof-add"]'));
  click('[data-act="prof-add"]'); await sleep(50);
  d.getElementById("nm").value = "Tom"; click('[data-act="prof-create"]'); await sleep(100);
  log.push("second child: " + w.eval("curProfile().name") + " newPerDay=" + w.eval("newPerDay()") + " (expect 3, not Lily's 5) keys=" + w.eval("Object.keys(localStorage).filter(k => k.indexOf('abc_srs_v1__') === 0).length"));
  w.eval("parentPage('view')"); await sleep(100);
  const ptxt = d.getElementById("app").innerText;
  log.push("parent page: accounts=" + ptxt.includes("小朋友账户") + " (expect false on the overview) weekly=" + ptxt.includes("每周小结") + " oldBackup=" + ptxt.includes("备份 / 恢复进度") + " wk=" + d.getElementById("wk").value.split("\n")[0]);
  log.push("wk textarea selectable: " + w.getComputedStyle(d.getElementById("wk")).userSelect + " rows=" + d.getElementById("wk").value.split("\n").length);
  click('[data-act="p-copy-wk"]'); await sleep(200);
  click('[data-act="p-tab"][data-t="acct"]'); await sleep(100);
  log.push("account tab: accounts=" + d.getElementById("app").innerText.includes("小朋友账户") + " paste box=" + !!d.getElementById("bk") + " copyText button=" + !!d.querySelector('[data-act="p-copy"]') + " (expect false) dangerFolded=" + !d.querySelector('details[data-keep="danger"]').open + " deleteButtons=" + d.querySelectorAll('[data-act="prof-delete"]').length);
  log.push(d.getElementById("app").innerText.includes("云同步") && d.querySelector('[data-act="c-create"]') ? "cloud section: shown, off by default" : "ERROR: cloud section missing on the account tab (real index.html scripts)");
  // download: intercept the anchor click, read the Blob back
  let dl = null; const realCreate = w.URL.createObjectURL; w.URL.createObjectURL = b => { dl = b; return realCreate.call(w.URL, b); };
  const origClick = w.HTMLAnchorElement.prototype.click; w.HTMLAnchorElement.prototype.click = function(){ log.push("download requested: " + this.download); };
  click('[data-act="prof-download"]'); await sleep(200);
  w.HTMLAnchorElement.prototype.click = origClick;
  const dtext = dl ? await dl.text() : "";
  log.push("download blob: " + (dl ? dl.type : "none") + " parses=" + (() => { try{ return JSON.parse(dtext).app; }catch(e){ return "NO"; } })());
  // import through a real <input type=file> + FileReader
  const rec = JSON.stringify({app: "abc_game", format: 1, name: "Zoe", data: {words: {teacher: {box: 3, due: 5, right: 2}}, doneDays: [], streak: 0, lastDone: 0}});
  const dt = new w.DataTransfer(); dt.items.add(new w.File([rec], "abc_Zoe.json", {type: "application/json"}));
  const imp = d.getElementById("imp"); imp.files = dt.files; imp.dispatchEvent(new w.Event("change", {bubbles: true}));
  for(let i = 0; i < 200 && !w.eval("PROFS.list.some(p => p.name === 'Zoe')"); i++) await sleep(50);      // FileReader is real-time, not virtual-time
  await sleep(100);
  log.push("imported file: current=" + w.eval("curProfile().name") + " words=" + w.eval("Object.keys(SRS.words).join()") + " profiles=" + w.eval("PROFS.list.map(p => p.name).join()"));
  // reload-like: rebuild state from localStorage
  w.eval("PROFS = readProfiles(); SRS = loadSRS();");
  log.push("after reload: current=" + w.eval("curProfile().name") + " words=" + w.eval("Object.keys(SRS.words).join()"));

  // ----- "玩一玩" must never get stuck: tap the right card very quickly in every round (the old bug) -----
  w.eval("home()"); await sleep(100);
  click('[data-act="lesson"][data-i="1"]'); await sleep(100);
  click('[data-act="game"]'); await sleep(50);
  let rounds = 0, stuckAt = -1;
  for(let n = 0; n < 8; n++){
    const before = w.eval("ri");
    const cardsG = d.querySelectorAll('[data-act="choose"]');
    if(!cardsG.length){ stuckAt = n; break; }
    const rightIdx = w.eval("choices.findIndex(c => c.id === rounds[ri].id)");
    const target = cardsG[rightIdx];
    target.click();                       // tapped immediately, usually while the prompt is still loading
    let waited = 0;
    while(w.eval("ri") === before && !d.getElementById("app").innerText.includes("再玩一次") && waited < 30000){ await sleep(100); waited += 100; }
    if(w.eval("ri") === before && !d.getElementById("app").innerText.includes("再玩一次")){ stuckAt = n; break; }
    rounds++;
  }
  log.push("game: rounds advanced=" + rounds + " stuckAt=" + stuckAt + " finished=" + d.getElementById("app").innerText.includes("再玩一次") + " (expect 8, -1, true)");

  // ----- transfer link in the real DOM: build it, open it as if tapped in another browser, confirm -----
  w.eval(`SRS = freshSRS(); SRS.words.teacher = Object.assign(newWord(todayNum()), {box: 3, due: todayNum() + 2}); saveSRS();`);
  const tlink = w.eval("transferLink()");
  log.push("transfer link: length=" + tlink.length + " ascii=" + /^[\x21-\x7e]+$/.test(tlink) + " base=" + tlink.split("#")[0].replace(/^.*\/\/[^/]*/, "").slice(0, 30));
  w.eval("PROFS.list.forEach(p => deleteProfile(p.id)); localStorage.clear();");
  w.history.replaceState(null, "", w.location.pathname + w.location.search + "#r=" + tlink.split("#r=")[1]);
  w.eval("hashHandled = false; boot()"); await sleep(100);
  log.push("link page: " + d.getElementById("app").innerText.replace(/\s+/g, " ").slice(0, 60) + " | hash cleared=" + (w.location.hash === "") + " profiles=" + w.eval("PROFS.list.length"));
  click('[data-act="p-hash-import"]'); await sleep(200);
  log.push("after import: current=" + w.eval("curProfile().name") + " words=" + w.eval("Object.keys(SRS.words).join()") + " box=" + w.eval("SRS.words.teacher.box"));
  w.eval("localStorage.clear()");
  out.textContent = log.join("\n");
  document.title = "DONE";
});
</script>
